version: '3.9'

services:

  # ── Serveur de base de données MySQL ──
  db:
    image: mysql:8.4
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: portfolio
      MYSQL_USER: raphael
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "raphael", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Serveur HTTP Flask ──
  web:
    build: .
    container_name: portfolio_web
    restart: unless-stopped
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      SECRET_KEY: changez-cette-cle-en-production-svp
      MYSQL_HOST: db
      MYSQL_USER: raphael
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: portfolio
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static/img:/app/static/img  # images persistantes

volumes:
  mysql_data:
