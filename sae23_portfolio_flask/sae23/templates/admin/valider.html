{% extends "base.html" %}
{% block title %}Valider une compétence{% endblock %}

{% block content %}

<section class="auth-section">
  <div class="container">
    <div class="auth-card auth-card-wide reveal">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h1 class="auth-title">Valider une compétence</h1>
        <p class="auth-sub">Choisissez un apprentissage critique et son niveau d'acquisition</p>
      </div>

      <form method="POST" action="{{ url_for('valider_competence') }}" class="auth-form" novalidate>

        <!-- Sélecteur semestre (pour filtrer) -->
        <div class="form-group">
          <label class="form-label" for="filtre_semestre">Filtrer par semestre</label>
          <select id="filtre_semestre" class="form-input" onchange="filtrerBlocs()">
            <option value="">— Tous les semestres —</option>
            {% for sem in semestres %}
            <option value="{{ sem.id }}">{{ sem.code }} — {{ sem.nom }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Sélecteur bloc (pour filtrer) -->
        <div class="form-group">
          <label class="form-label" for="filtre_bloc">Filtrer par bloc</label>
          <select id="filtre_bloc" class="form-input" onchange="filtrerComps()">
            <option value="">— Tous les blocs —</option>
            {% for sem in semestres %}
              {% for bloc in sem.blocs %}
              <option value="{{ bloc.id }}" data-sem="{{ sem.id }}">{{ bloc.code }} — {{ bloc.nom }}</option>
              {% endfor %}
            {% endfor %}
          </select>
        </div>

        <!-- Sélecteur compétence -->
        <div class="form-group">
          <label class="form-label" for="competence_id">Apprentissage critique <span class="required">*</span></label>
          <select id="competence_id" name="competence_id" class="form-input" required>
            <option value="">— Sélectionner une compétence —</option>
            {% for sem in semestres %}
              {% for bloc in sem.blocs %}
                {% for comp in bloc.competences %}
                <option value="{{ comp.id }}"
                        data-sem="{{ sem.id }}"
                        data-bloc="{{ bloc.id }}"
                        {% if request.args.get('comp') == comp.id|string %}selected{% endif %}>
                  {{ comp.code }} — {{ comp.nom[:70] }}{% if comp.nom|length > 70 %}…{% endif %}
                  ({{ sem.code }})
                </option>
                {% endfor %}
              {% endfor %}
            {% endfor %}
          </select>
        </div>

        <!-- Niveau d'acquisition -->
        <div class="form-group">
          <label class="form-label">Niveau d'acquisition <span class="required">*</span></label>
          <div class="niveau-grid">
            {% for value, label, css in niveaux %}
            <label class="niveau-choice {{ css }}">
              <input type="radio" name="niveau" value="{{ value }}" required>
              <span class="niveau-choice-label">{{ label }}</span>
            </label>
            {% endfor %}
          </div>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('admin_dashboard') }}" class="btn-ghost">
            ← Retour au dashboard
          </a>
          <button type="submit" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Enregistrer
          </button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
// Filtre dynamique semestre → bloc → compétence
function filtrerBlocs() {
  const semVal = document.getElementById('filtre_semestre').value;
  const blocSel = document.getElementById('filtre_bloc');
  Array.from(blocSel.options).forEach(opt => {
    if (!opt.value) return;
    opt.hidden = semVal ? opt.dataset.sem !== semVal : false;
  });
  blocSel.value = '';
  filtrerComps();
}

function filtrerComps() {
  const semVal  = document.getElementById('filtre_semestre').value;
  const blocVal = document.getElementById('filtre_bloc').value;
  const compSel = document.getElementById('competence_id');
  Array.from(compSel.options).forEach(opt => {
    if (!opt.value) return;
    const matchSem  = !semVal  || opt.dataset.sem  === semVal;
    const matchBloc = !blocVal || opt.dataset.bloc === blocVal;
    opt.hidden = !(matchSem && matchBloc);
  });
  compSel.value = '';
}

// Pré-sélectionner si comp= dans l'URL
const preselect = new URLSearchParams(location.search).get('comp');
if (preselect) {
  document.getElementById('competence_id').value = preselect;
}
</script>

{% endblock %}
