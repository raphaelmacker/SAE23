{% extends "base.html" %}
{% block title %}Connexion{% endblock %}

{% block content %}

<section class="auth-section">
  <div class="container">
    <div class="auth-card reveal">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1 class="auth-title">Connexion</h1>
        <p class="auth-sub">Espace d'administration du portfolio</p>
      </div>

      <form method="POST" action="{{ url_for('login') }}" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Identifiant</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="admin"
            required
            autocomplete="username"
            maxlength="80"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              maxlength="256"
            >
            <button type="button" class="toggle-pwd" onclick="togglePwd()" title="Afficher/masquer">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Se connecter
        </button>
      </form>

      <div class="auth-hint">
        <span class="auth-hint-label">Compte par défaut :</span>
        <code>admin / admin123</code>
        <span class="auth-hint-warn">⚠️ Changez ce mot de passe en production</span>
      </div>
    </div>
  </div>
</section>

<script>
function togglePwd() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}
</script>

{% endblock %}
